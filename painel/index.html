<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Navegação OCI – Risco Cirúrgico</title>
<style>:root{--bg:#f4f6f8;--card:#fff;--tx:#14212b;--mut:#5d6b77;--bd:#dde3e8;--pri:#0b6e6e;--pri-tx:#fff;--ok:#1b7f3b;--okbg:#e2f4e8;--wa:#9a5b00;--wabg:#fdf0d8;--er:#b3261e;--erbg:#fbe4e2;--in:#1f5fa8;--inbg:#e3eefa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f161c;--card:#18222a;--tx:#e8eef2;--mut:#9aa8b3;--bd:#2c3a45;--pri:#3fb5b5;--pri-tx:#06201f;--ok:#6fd48e;--okbg:#17301f;--wa:#f0b955;--wabg:#33260d;--er:#ff8a80;--erbg:#3a1a18;--in:#7db4f0;--inbg:#14263a}}
:root[data-theme="dark"]{--bg:#0f161c;--card:#18222a;--tx:#e8eef2;--mut:#9aa8b3;--bd:#2c3a45;--pri:#3fb5b5;--pri-tx:#06201f;--ok:#6fd48e;--okbg:#17301f;--wa:#f0b955;--wabg:#33260d;--er:#ff8a80;--erbg:#3a1a18;--in:#7db4f0;--inbg:#14263a}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--pri);color:var(--pri-tx);padding:12px 16px;display:flex;align-items:center;gap:10px;z-index:5}
header h1{font-size:17px;margin:0;flex:1}
header button{background:transparent;border:0;color:inherit;font-size:15px;cursor:pointer;padding:4px 8px}
header small{opacity:.85;font-size:12px}
main{max-width:720px;margin:0 auto;padding:14px}
main.wide{max-width:1100px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.mut{color:var(--mut);font-size:14px}
.badge{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--ok)}.b-wa{background:var(--wabg);color:var(--wa)}.b-in{background:var(--inbg);color:var(--in)}.b-er{background:var(--erbg);color:var(--er)}
button.p,button.s{font:inherit;font-weight:600;border-radius:10px;padding:11px 16px;cursor:pointer;border:1px solid var(--pri)}
button.p{background:var(--pri);color:var(--pri-tx)}button.s{background:transparent;color:var(--pri);padding:6px 10px;font-size:14px}
button.w{width:100%}
button.x{background:none;border:0;color:var(--er);cursor:pointer;font-size:14px;padding:4px 0}
label{display:block;font-size:14px;font-weight:600;margin:10px 0 4px}
input,select{width:100%;font:inherit;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
input[type=date],input[type=time]{display:block;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;text-align:left;min-height:46px}
.err{color:var(--er);font-size:13px;margin-top:4px;min-height:1em}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.item:last-child{border-bottom:0}
.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;flex:none}
.d-ok{background:var(--ok);color:var(--card)}.d-ck{background:var(--in);color:var(--card)}.d-no{border:2px solid var(--bd);color:var(--mut)}.d-er{border:2px solid var(--er);color:var(--er)}
.bar{height:8px;border-radius:9px;background:var(--bd);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ok)}
.tl{border-left:3px solid var(--bd);margin-left:8px;padding-left:14px}
.tl>div{position:relative;padding-bottom:14px}
.tl>div:before{content:"";position:absolute;left:-21px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--pri)}
.tl>div.ck:before{background:var(--in)}
.tl>div.ok:before{background:var(--ok)}
h2{font-size:16px;margin:0 0 6px}
.empty{text-align:center;padding:30px 10px;color:var(--mut)}
.pcard{cursor:pointer}
.tb{width:100%;border-collapse:collapse;min-width:560px;font-size:14px}.tb th,.tb td{padding:9px 6px;border-bottom:1px solid var(--bd);text-align:center}.tb th:first-child,.tb td:first-child{text-align:left}.tb tr.rw{cursor:pointer}.tb .ok{color:var(--ok);font-weight:700}.tb .ck{color:var(--in);font-weight:700}.tb .er{color:var(--er);font-weight:700}.tb .mt{color:var(--mut)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}.grid4 b{font-size:22px;display:block}
.cf{border-radius:10px;padding:10px;margin:6px 0 10px;font-size:14px}
.grid4{margin-bottom:12px}.grid5{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;text-align:center;margin-bottom:12px}.kp{cursor:pointer;margin:0;padding:10px 6px}.kp.on{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri)}
.card{border-radius:16px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
header h1{font-weight:700;letter-spacing:-.01em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin-bottom:12px}
.kpi{font:inherit;text-align:left;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--c);border-radius:14px;padding:12px 14px;cursor:pointer;box-shadow:0 1px 2px rgba(16,24,40,.05);transition:box-shadow .15s}
.kpi:hover{box-shadow:0 6px 16px rgba(16,24,40,.1)}
.kpi b{display:block;font-size:30px;line-height:1.05;font-weight:800;letter-spacing:-.02em;color:var(--c)}
.kpi span{font-size:13px;color:var(--mut)}
.kpi.on{background:color-mix(in srgb,var(--c) 10%,var(--card));box-shadow:0 0 0 2px var(--c)}
.dist{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--bd);margin-top:8px}.dist i{display:block;height:100%}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-top:10px}.lg u{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;text-decoration:none}
.pr{display:grid;grid-template-columns:1fr;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin-bottom:10px;cursor:pointer;box-shadow:0 1px 2px rgba(16,24,40,.05);transition:box-shadow .15s,transform .15s}
.pr:hover{box-shadow:0 8px 20px rgba(16,24,40,.1);transform:translateY(-1px)}
@media(min-width:760px){.pr{grid-template-columns:minmax(190px,1.1fr) 2fr auto;align-items:center;gap:20px}}
.pn b{display:block;font-weight:700}
.steps{display:flex;align-items:flex-start}
.st{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;font-size:11px;line-height:1.25;color:var(--mut);text-align:center}
.st .d{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--card);border:2px solid var(--bd);z-index:1}
.st:not(:last-child):after{content:"";position:absolute;top:13px;left:50%;width:100%;height:2px;background:var(--bd)}
.st .l{margin-top:5px}
.st.ok .d{background:var(--ok);border-color:var(--ok);color:var(--card)}.st.ok:not(:last-child):after{background:var(--ok)}
.st.ck .d{background:var(--in);border-color:var(--in);color:var(--card)}
.st.er .d{border-color:var(--er);color:var(--er)}
:root{--bg:#f1f6fa;--bd:#d9e3ec;--pri:#0f5fa8;--pri-tx:#fff;--g2:#0e8a7d;--in:#0891b2;--inbg:#e0f4f9;--ok:#15803d;--okbg:#e3f6ea;--wa:#0d9488;--wabg:#d8f3ef}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1620;--card:#162331;--bd:#27394a;--pri:#5aa9f0;--pri-tx:#06182b;--g2:#3cc2a8;--in:#4fc3e0;--inbg:#12303a;--ok:#6fd48e;--okbg:#15301f;--wa:#2dd4bf;--wabg:#0f2f2c}}
:root[data-theme="dark"]{--bg:#0d1620;--card:#162331;--bd:#27394a;--pri:#5aa9f0;--pri-tx:#06182b;--g2:#3cc2a8;--in:#4fc3e0;--inbg:#12303a;--ok:#6fd48e;--okbg:#15301f;--wa:#2dd4bf;--wabg:#0f2f2c}
header{background:linear-gradient(120deg,var(--pri),var(--g2))}
button.p{background:linear-gradient(120deg,var(--pri),var(--g2));border-color:transparent}
.kpi b,.kpi.on{transition:none}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:5px 12px;font-size:14px;cursor:pointer}
.chip.on{background:var(--pri);color:var(--pri-tx);border-color:var(--pri)}
@media(max-width:600px){header{flex-wrap:wrap}header h1{font-size:15px}main{padding:10px}.row{flex-wrap:wrap}.steps{min-width:0}.st{font-size:10px}.st .d{width:24px;height:24px}.st:not(:last-child):after{top:11px}.pr{padding:12px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi b{font-size:26px}.chips{gap:5px}.chip{font-size:12px;padding:6px 9px}}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--in);outline-offset:2px}

.demo-notice{padding:10px 16px;text-align:center;background:#fff1ce;color:#4f3400;font-weight:650}</style>
</head>
<body>
<header>
  <button id="back" type="button" hidden>‹ Voltar</button>
  <h1 id="ttl">Navegação OCI · Risco Cirúrgico</h1>
  <small id="sync" role="status">Conectando…</small>
  <button id="out" type="button" hidden>Encerrar sessão</button>
</header>
<aside class="demo-notice">Demonstração pública · Base compartilhada de teste · Use somente casos fictícios</aside>
<main id="app"><div class="empty">Conectando à base de teste…</div></main>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script><script>const OOXML = "http://schemas.openxmlformats.org";
const BOOK_NS = OOXML+"/spreadsheetml/2006/main";
const REL_NS = OOXML+"/officeDocument/2006/relationships";
const PACKAGE_REL = OOXML+"/package/2006/relationships";

function xmlText(value) {
  return String(value ?? "").replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\uFFFE\uFFFF]/g,"")
    .replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"}[c]));
}

function columnName(index) {
  let name = "";
  for (let n=index+1; n>0; n=Math.floor((n-1)/26)) name=String.fromCharCode(65+(n-1)%26)+name;
  return name;
}

function sheetXml(rows) {
  const lines = rows.map((row,index) => {
    const number = index+1;
    const cells = row.map((value,column) => {
      const ref = columnName(column)+number;
      if (typeof value==="number" && Number.isFinite(value)) return '<c r="'+ref+'"><v>'+value+'</v></c>';
      return '<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+xmlText(value)+'</t></is></c>';
    });
    return '<row r="'+number+'">'+cells.join("")+'</row>';
  });
  return '<worksheet xmlns="'+BOOK_NS+'"><sheetData>'+lines.join("")+'</sheetData></worksheet>';
}

function makeWorkbook(sheets) {
  const {strToU8,zipSync} = window.fflate;
  const relationships = sheets.map((_,i)=>'<Relationship Id="rId'+(i+1)+'" Type="'+REL_NS+'/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>');
  const entries = sheets.map(([name],i)=>'<sheet name="'+xmlText(name)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>');
  const types = sheets.map((_,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>');
  const files = {
    "[Content_Types].xml": '<Types xmlns="'+OOXML+'/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+types.join("")+'</Types>',
    "_rels/.rels": '<Relationships xmlns="'+PACKAGE_REL+'"><Relationship Id="rId1" Type="'+REL_NS+'/officeDocument" Target="xl/workbook.xml"/></Relationships>',
    "xl/workbook.xml": '<workbook xmlns="'+BOOK_NS+'" xmlns:r="'+REL_NS+'"><sheets>'+entries.join("")+'</sheets></workbook>',
    "xl/_rels/workbook.xml.rels": '<Relationships xmlns="'+PACKAGE_REL+'">'+relationships.join("")+'</Relationships>'
  };
  sheets.forEach(([,rows],i) => { files["xl/worksheets/sheet"+(i+1)+".xml"] = sheetXml(rows); });
  const utf8 = Object.fromEntries(Object.entries(files).map(([path,contents])=>[path,strToU8('<?xml version="1.0" encoding="UTF-8"?>'+contents)]));
  return new Blob([zipSync(utf8)],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}

const EX={rx:{n:"Raio-X de tórax",req:0},lab:{n:"Exame laboratorial",req:0},ecg:{n:"ECG",req:1},consulta:{n:"Consulta com especialista",req:1}};
const CEM="Centro de Especialidades Maria Célia",LOC={ecg:[CEM],consulta:[CEM],rx:["HST"],lab:["3 Irmãos"]};
function setLoc(){$("#loc").value=LOC[$("#ex").value][0]}
let N=[],P=[],R=[],ready=false,view={p:null,add:false,q:"",f:"all",tab:"d",df:"all"};
const $=s=>document.querySelector(s);

const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>crypto.randomUUID().replace(/-/g,"");
const today=()=>new Intl.DateTimeFormat("sv-SE",{timeZone:"America/Sao_Paulo"}).format(new Date());
const fmtCpf=v=>{v=v.replace(/\D/g,"").slice(0,11);return v.replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d{1,2})$/,"$1-$2")};
function cpfOk(c){c=c.replace(/\D/g,"");if(c.length!==11||/^(\d)\1+$/.test(c))return false;for(let t=9;t<11;t++){let s=0;for(let i=0;i<t;i++)s+=c[i]*(t+1-i);if((s*10%11)%10!=c[t])return false}return true}
const fmtD=d=>d?String(d).split("-").reverse().join("/"):"";
const hh=x=>x&&x.hora?" às "+x.hora:"";
const regsOf=pid=>{const o={};R.forEach(r=>{if(r.pid===pid)o[r.exame]=r});return o};
function base(p){let a=p.agend||null,m=null;R.forEach(r=>{if(r.pid===p.id)["checkin","realizado"].forEach(t=>{const g=r[t]&&r[t].agend,x=r[t]&&r[t].data;if(g&&(!a||g<a))a=g;if(x&&(!m||x<m))m=x})});return a||m}
function val(p){
  if(status(p)[2]==="c")return{k:"c",t:"OCI concluída",s:"Concluída",c:"b-ok"};
  const b=base(p);if(!b)return{k:"n",t:"Sem data do 1º agendamento",s:"Sem data",c:"b-in"};
  const[y,m]=b.split("-").map(Number),v=new Date(Date.UTC(y,m+1,0)),n=Date.parse(today());
  const days=Math.round((v-n)/864e5),vs=v.toLocaleDateString("pt-BR",{timeZone:"UTC"});
  if(days<0)return{k:"x",t:`Vencida em ${vs} (há ${-days} dia${-days>1?"s":""})`,s:`Vencida há ${-days}d`,c:"b-er",days};
  if(days<=15)return{k:"w",t:`Vence em ${days} dia${days===1?"":"s"} · ${vs}`,s:days===0?"Vence hoje":`Vence em ${days}d`,c:"b-wa",days};
  return{k:"o",t:`Válida até ${vs}`,s:`Até ${vs.slice(0,5)}`,c:"b-in",days};
}
function vbadge(p){const v=val(p);return v.k==="c"?"":`<div style="margin:4px 0"><span class="badge ${v.c}">${v.t}</span></div>`}
function status(p){const d=regsOf(p.id);if(d.ecg?.realizado&&d.consulta?.realizado)return["Completo","b-ok","c"];if(Object.keys(d).length)return["Em andamento","b-in","i"];return["Aguardando","b-wa","a"]}
function go(v){view={...view,cf:null,cfn:null,msg:null,deleteConfirm:null,...v};examDraft=null;render();scrollTo(0,0)}
$("#back").onclick=()=>go({p:null,add:false});

function render(){
  $("#back").hidden=!(view.p||view.add);
  $("#ttl").textContent=view.add?"Novo paciente":view.p?"Paciente":"Navegação OCI · Risco Cirúrgico";
  if(!ready){return}
  $("#app").className=view.p||view.add?"":"wide";$("#app").innerHTML=view.add?addV():view.p?detV():listV();
  refresh();
}
function refresh(){
  if(!ready||view.add)return;
  if(view.p){if(!P.find(x=>x.id===view.p)){view.p=null;return render()}$("#dyn").innerHTML=dynV()}
  else $("#lst").innerHTML=lstV();
}
function listV(){
  const tabs=`<div class="chips" style="margin-top:0">${[["d","Painel"],["l","Lista"],["r","Relatório"],["n","Navegadores"]].map(([k,n])=>`<button class="chip ${view.tab===k?"on":""}" data-action="aba" data-arg0="${k}">${n}</button>`).join("")}<button class="chip" style="margin-left:auto;background:var(--pri);color:var(--pri-tx);border-color:var(--pri)" data-action="novo">+ Novo paciente</button></div>`;
  if(view.tab==="d")return tabs+dashHead()+'<div id="lst"></div>';
  if(view.tab==="r")return tabs+repHead()+'<div id="lst"></div>';
  if(view.tab==="n")return tabs+navHead()+'<div id="lst"></div>';
  const f=[["all","Todos"],["a","Aguardando"],["i","Em andamento"],["c","Completos"]];
  return tabs+`<button class="p w" data-action="novo">+ Cadastrar paciente</button>
  <input id="busca" style="margin:12px 0 0" placeholder="Buscar caso de teste" value="${esc(view.q)}">
  <div class="chips">${f.map(([k,n])=>`<button class="chip ${view.f===k?"on":""}" data-action="filtro" data-arg0="${k}">${n}</button>`).join("")}</div><div id="lst"></div>`;
}
function lstV(){
  if(view.tab==="d")return dashV();
  if(view.tab==="r")return repV();
  if(view.tab==="n")return navV();
  const q=view.q.toLowerCase(),qd=q.replace(/\D/g,"");
  const L=[...P].sort((a,b)=>(b.criado||"")>(a.criado||"")?1:-1).filter(p=>(view.f==="all"||status(p)[2]===view.f)&&(!q||p.nome.toLowerCase().includes(q)||p.req.toLowerCase().includes(q)||(qd&&p.cpf.replace(/\D/g,"").includes(qd))));
  return L.length?L.map(p=>{const[s,k]=status(p),d=regsOf(p.id),n=Object.keys(EX).filter(x=>d[x]?.realizado).length,c=Object.keys(d).filter(x=>d[x].checkin&&!d[x].realizado).length;
    return `<div class="card pcard" tabindex="0" role="button" data-action="paciente" data-arg0="${p.id}"><div class="row"><b>${esc(p.nome)}</b><span class="badge ${k}">${s}</span></div><div class="mut">ID ${esc(p.req)}</div>${vbadge(p)}<div class="mut">${n} de 4 itens realizados${c?` · ${c} com check-in aguardando resultado`:""}</div></div>`}).join(""):`<div class="empty">${P.length?"Nenhum paciente encontrado.":"Nenhum paciente em monitoramento ainda."}</div>`;
}
function addV(){
  return `<div class="card">
  
  <label for="req">Número do caso de teste</label><input id="req" type="number" min="1" max="999" placeholder="1 a 999"><div class="err" id="e3"></div>
  <label>Navegador responsável</label><select id="nv">${navOpts("")}</select><div class="err" id="e4"></div><div class="mut">A validade da OCI (2 competências) começa a contar quando o primeiro exame for agendado.</div>
  <button class="p w" id="sv" style="margin-top:12px" data-action="salvar-paciente">Iniciar monitoramento</button></div>
  <div class="mut">Na versão recebida: ECG e consulta são etapas obrigatórias; Raio-X e laboratório são opcionais. Critérios clínicos e prazos exigem validação pela equipe responsável.</div>`;
}
function detV(){
  const p=P.find(x=>x.id===view.p);if(!p)return"";
  return `<div class="card"><div class="row"><h2>${esc(p.nome)}</h2><span id="bd"></span></div>
  <div class="mut">ID ${esc(p.req)}</div><div class="mut">Cadastrado em ${fmtD(p.criado)}</div></div>
  <div id="dyn"></div>
  
  <div class="card" id="frm"><h2>Agendar exame</h2>
  <label>Exame ou atendimento</label><select id="ex">${Object.entries(EX).map(([k,v])=>`<option value="${k}">${v.n}${v.req?" (obrigatório)":""}</option>`).join("")}</select>

let papel = "";
let examDraft = null;
let revision = -1;
let syncTask;
let connected = false;
let sessionEnded = false;
const collections = { pacientes: new Map(), registros: new Map(), navegadores: new Map() };

async function call(method, value) {
  const response = await fetch("https://yivjdmerfqucnnbdiqvi.supabase.co/functions/v1/oci-public-demo", {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=UTF-8" },
    body: JSON.stringify({method,value}),
    signal: AbortSignal.timeout(12000),
  });
  const result = await response.json();
  if (result?.ok) return result.value;
  throw Object.assign(new Error(result?.message || "Serviço indisponível."), {code: result?.code});
}

function applySnapshot(result) {
  papel = result.role;
  if (result.reset) Object.values(collections).forEach(group => group.clear());
  for (const [group, id, record] of result.changes) {
    if (record) collections[group].set(id, { ...record.data, id, versao: record.version });
    else collections[group].delete(id);
  }
  revision = result.revision;
  P = [...collections.pacientes.values()];
  N = [...collections.navegadores.values()].sort((a,b) => a.nome.localeCompare(b.nome,"pt-BR"));
  R = [...collections.registros.values()];
}

function lockView(message) {
  ready = false;
  connected = false;
  revision = -1;
  Object.values(collections).forEach(group => group.clear());
  P = [];
  N = [];
  R = [];
  examDraft = null;
  view = { p:null,add:false,q:"",f:"all",tab:"d",df:"all" };
  $("#back").hidden = true;
  $("#out").hidden = true;
  $("#sync").textContent = "Demonstração pública";
  const notice = document.createElement("div");
  notice.className = "empty";
  notice.textContent = message;
  $("#app").replaceChildren(notice);
}

async function sync() {
  if (sessionEnded) return;
  if (syncTask) return syncTask;
  syncTask = (async () => {
    try {
      const previousRevision = revision;
      const result = await call("readOci", revision);
      if (sessionEnded) return;
      applySnapshot(result);
      connected = true;
      $("#out").hidden = true;
      $("#sync").textContent = "Base de teste sincronizada ✓";
      if (!ready) {
        ready = true;
        render();
      } else if (revision !== previousRevision) refresh();
    } catch (error) {
      connected = false;
      if (error.code === "DENIED") lockView("A conta Google conectada não está autorizada para abrir o OCI.");
      else if (!ready) lockView("A conexão com o OCI está indisponível. Recarregue a página para tentar de novo.");
      else $("#sync").textContent = "Sem conexão. Alterações pausadas.";
    }
  })();
  try { await syncTask; }
  finally { syncTask = null; }
}

async function write(operation) {
  if (!connected) throw new Error("Aguarde a conexão para salvar.");
  await call("writeOci", { ...operation, request: crypto.randomUUID() });
  await sync();
  await sync();
}

function showError(selector, error) {
  const target = $(selector);
  const message = error.code === "CONFLICT"
    ? "Este registro mudou em outro computador. Confira os dados atualizados e tente novamente."
    : error.message;
  if (target) target.textContent = message;
  else if (ready) alert(message);
  if (error.code === "CONFLICT" || error.code === "DENIED") void sync();
}

  const req = $("#req").value;
  const nav = $("#nv").value;
  if (!/^[1-9]\d{0,2}$/.test(req)) return showError("#e3", new Error("Informe um número de 1 a 999."));
  if (!nav) return showError("#e4", new Error("Selecione um navegador de teste."));
  const id = uid();
  const button = $("#sv");
  if (button.disabled) return;
  button.disabled = true;
  try {
    await write({ action:"insert", group:"pacientes", id, data:{ req,nav } });
    if (ready) go({add:false,p:id});
  } catch (error) { showError("#e3",error); }
  finally { button.disabled = false; }
}

async function addNav() {
  const field = $("#nn");
  const nome = field.value.trim().replace(/\s+/g," ");
  if (!/^[1-9]\d{0,2}$/.test(nome)) return showError("#ne", new Error("Informe um número de 1 a 999."));
  if (field.disabled) return;
  field.disabled = true;
  try {
    await write({ action:"insert", group:"navegadores", id:uid(), data:{ nome } });
    field.value = "";
    if ($("#ne")) $("#ne").textContent = "";
  } catch (error) { showError("#ne",error); }
  finally { field.disabled = false; }
}

async function delNav(id) {
  const nav = collections.navegadores.get(id);
  if (!nav) return;
  if (view.deleteNav?.id !== id) {
    view.deleteNav = { id, version:nav.versao };
    refresh();
    return;
  }
  const {version} = view.deleteNav;
  view.deleteNav = null;
  try { await write({ action:"delete", group:"navegadores", id, version }); }
  catch (error) { showError("#ne",error); }
  refresh();
}

function examVersion(pid,exam) {
  return collections.registros.get(pid+"_"+exam)?.versao ?? null;
}

function markExamDraft() {
  if (!view.p || !$("#ex")) return;
  const exam = $("#ex").value;
  if (examDraft?.exam !== exam || examDraft?.pid !== view.p) {
    examDraft = { pid:view.p, exam, version:examVersion(view.p,exam) };
  }
}

function pick(exam) {
  $("#ex").value = exam;
  setLoc();
  markExamDraft();
  $("#frm").scrollIntoView({behavior:"smooth"});
  $("#dt").focus();
}

function announce(message) {
  view.msg = message;
  refresh();
  setTimeout(() => {
    if (view.msg === message) {
      view.msg = null;
      refresh();
    }
  }, 5000);
}

async function addX(pid) {
  const exame = $("#ex").value;
  const button = $("#sv");
  const data = $("#dt").value;
  const por = $("#por").value;
  const hora = $("#hr").value;
  const obs = "";
  if (!data || !por) return showError("#pe",new Error("Informe a data e o navegador responsável."));
  if (button.disabled) return;
  markExamDraft();
  button.disabled = true;
  try {
    await write({action:"schedule",group:"registros",id:pid+"_"+exame,version:examDraft.version,
      data:{local:LOC[exame][0],por,data,hora,obs,agend:data}});
    examDraft = null;
    if (view.p === pid) {
      $("#hr").value = "";
      $("#pe").textContent = "";
      announce(EX[exame].n+" agendado para "+fmtD(data)+".");
    }
  } catch (error) {
    if (error.code === "CONFLICT") examDraft = null;
    showError("#pe",error);
  } finally { button.disabled = false; }
}

async function confirmOk(pid,exam) {
  const data = $("#cfd").value;
  const por = $("#cfp").value;
  const hora = $("#cfh").value;
  if (!data || data > today() || !por) return showError("#cfe",new Error("Informe o navegador e uma data de realização válida."));
  try {
    await write({ action:"complete", group:"registros", id:pid+"_"+exam,version:view.cfVersion,data:{data,por,hora} });
    if (view.p === pid) {
      view.cf = null;
      announce(EX[exam].n+" marcado como realizado em "+fmtD(data)+".");
    }
  } catch (error) {
    if (error.code === "CONFLICT") view.cf = null;
    showError("#cfe",error);
  }
}

async function delX(pid,exam,stage) {
  const id = pid+"_"+exam;
  const key = exam+stage;
  if (view.deleteConfirm?.key !== key) {
    view.deleteConfirm = { key, version:examVersion(pid,exam) };
    return refresh();
  }
  const { version } = view.deleteConfirm;
  view.deleteConfirm = null;
  try { await write({ action:"remove-stage", group:"registros", id, version, stage }); }
  catch (error) { showError("#pe",error); }
  refresh();
}

async function delP(id) {
  try {
    await write({action:"delete",group:"pacientes",id,version:view.patientDeleteVersion});
    if (ready) go({p:null});
  } catch (error) { showError("#dpe",error); }
}

async function expXlsx() {
  try {
    const report = rep();
    const sheets = [
      ["Resumo", [["Relatório OCI - Risco Cirúrgico"], ...fl(), ["Gerado em",fmtD(today())], [], ["Indicador","Valor"], ...inds(report)]],
      ["Pacientes", [HEAD(),...rowsP(filtS(report.c))]]
    ];
    await saveFile(fname("xlsx"), makeWorkbook(sheets));
  } catch { showError("#rerr", new Error("Não foi possível gerar o Excel.")); }
}

const actions = {
  novo: () => go({add:true}), paciente: id => go({p:id}),
  aba: key => { view.tab=key; render(); },
  filtro: key => { view.f=key; render(); },
  "filtro-painel": key => { view.df=view.df===key?"all":key; render(); },
  "limpar-painel": () => { view.df="all"; render(); },
  "todos-meses": () => { view.rm=""; render(); },
  "salvar-paciente": addP, "pedir-exclusao": askDel, "cancelar-exclusao": cancelDel, "excluir-paciente": delP,
  "adicionar-navegador": addNav, "remover-navegador": delNav,
  "selecionar-exame": pick, agendar:addX, "pedir-realizacao":askOk,
  "confirmar-realizacao":confirmOk, "cancelar-realizacao": () => { view.cf=null; refresh(); },
  "remover-evento":delX, excel:expXlsx, pdf:expPdf
};

function triggerAction(event) {
  const target = event.target.closest("[data-action]");
  if (!target || !ready) return;
  const { action,arg0,arg1,arg2 } = target.dataset;
  if (Object.hasOwn(actions,action)) Promise.resolve(actions[action](arg0,arg1,arg2)).catch(() => showError("#rerr",new Error("A operação não foi concluída.")));
}

$("#out").addEventListener("click", () => {
  sessionEnded = true;
  lockView("Sessão do OCI encerrada. Feche esta aba ao terminar. Para voltar, reabra o endereço com sua conta Google.");
});
document.addEventListener("click", triggerAction);
document.addEventListener("keydown", event => {
  if ((event.key === "Enter" || event.key === " ") && event.target.dataset.action === "paciente") {
    event.preventDefault();
    triggerAction(event);
  }
});
document.addEventListener("input", event => {
  const {id,value} = event.target;
  if (id === "busca") { view.q=value; refresh(); }
  if (id === "cpf") event.target.value=fmtCpf(value);
  if (id === "cfd") view.cfd=value;
  if (id === "cfh") view.cfh=value;
  if (["dt","hr","ob"].includes(id)) markExamDraft();
});
document.addEventListener("change", event => {
  const {id,value} = event.target;
  if (id === "ex") { setLoc(); markExamDraft(); }
  if (id === "por") markExamDraft();
  if (id === "cfp") view.cfn=value;
  const report = {rm:"rm","filtro-navegador":"rn","filtro-relatorio":"rs"};
  if (Object.hasOwn(report,id)) { view[report[id]]=value; refresh(); }
});

void sync();
setInterval(() => { if (!document.hidden) void sync(); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) void sync(); });
</script>
</body>
</html>
